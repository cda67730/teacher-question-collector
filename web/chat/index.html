<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>融合教育小幫手</title>
<link rel="stylesheet" href="chat.css">
</head>
<body>
<div class="app">
  <header class="top">
    <h1 id="botName">融合教育小幫手</h1>
    <div class="top-actions">
      <button class="ghost" id="traceBtn" type="button" hidden aria-controls="drawer" aria-expanded="false">🔍 流程</button>
      <button class="ghost" id="reset" type="button" hidden>開新問題</button>
    </div>
  </header>

  <section id="gate" class="gate">
    <p class="muted">請輸入園所提供的邀請碼。對話內容會去除孩子姓名後保存，用於改善服務。</p>
    <label for="code">邀請碼</label>
    <input id="code" autocomplete="off" placeholder="例如 TEST-2026">
    <p class="err" id="gateErr"></p>
    <button class="primary" id="enter" type="button">開始</button>
  </section>

  <main id="chat" class="chat" hidden aria-live="polite"></main>

  <form id="composer" class="composer" hidden>
    <label for="msg" hidden>輸入訊息</label>
    <textarea id="msg" rows="2" placeholder="描述你在班上遇到的狀況…"></textarea>
    <button class="primary" id="send" type="submit">送出</button>
  </form>
</div>

<!-- 流程觀測面板：只有邀請碼「觀測」欄為 TRUE 時出現 -->
<div class="scrim" id="scrim" hidden></div>
<aside id="drawer" class="drawer" aria-hidden="true" aria-labelledby="drawerTitle">
  <div class="drawer-h">
    <div><b id="drawerTitle">回答流程</b><div class="muted small" id="drawerSub"></div></div>
    <div class="drawer-nav">
      <button class="ghost" id="dPrev" type="button" aria-label="上一回合">‹</button>
      <button class="ghost" id="dNext" type="button" aria-label="下一回合">›</button>
      <button class="ghost" id="dClose" type="button" aria-label="關閉">✕</button>
    </div>
  </div>
  <div class="drawer-b" id="drawerBody"></div>
</aside>
<script src="config.js"></script>
<script src="trace.js"></script>
<script src="chat.js"></script>
</body>
</html>
